name: Deploy til simply.com (FTP)

# Kører automatisk ved push til main, og kan også startes manuelt
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Undgå at to deploys kører oven i hinanden
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Test med PHP 7.4-kompatibilitetsniveau
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, simplexml, dom
          coverage: none

      - name: Opdatér seneste kendte RSS-feed
        shell: bash
        run: |
          rss_download="$RUNNER_TEMP/podcast-rss.xml"
          if curl --fail --location --silent --show-error --retry 2 \
            'https://anchor.fm/s/10eb99934/podcast/rss' --output "$rss_download"; then
            if php -r '$x = @simplexml_load_file($argv[1]); exit($x && isset($x->channel->item) ? 0 : 1);' "$rss_download"; then
              cp "$rss_download" data/podcast-rss-fallback.xml
              echo "RSS-snapshot opdateret før deployment."
            else
              echo "Advarsel: Det hentede RSS-feed var ugyldigt; bruger repoets snapshot."
            fi
          else
            echo "Advarsel: RSS kunne ikke hentes; bruger repoets snapshot."
          fi

      - name: Tjek PHP, RSS og YouTube-katalog
        run: |
          php -l public_html/index.php
          php -r '$x = @simplexml_load_file($argv[1]); if (!$x || count($x->channel->item) < 1) { fwrite(STDERR, "RSS-snapshot er ugyldigt.\n"); exit(1); }' data/podcast-rss-fallback.xml
          php -r '$c = json_decode(file_get_contents($argv[1]), true); $e = $c["episodes"] ?? []; $ids = array_column($e, "id"); if (count($e) < 72 || count(array_unique($ids)) !== count($e)) { fwrite(STDERR, "YouTube-kataloget skal have mindst 72 unikke matches.\n"); exit(1); } foreach ($ids as $id) if (!preg_match("/^[A-Za-z0-9_-]{11}$/", $id)) exit(1);' data/youtube-catalog-seed.json

      - name: Kør regressionstest før deployment
        run: bash tests/run-release.sh

      - name: Upload til simply.com via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps

          # Repoet spejler hele FTP-roden (public_html + alias-domæner),
          # så vi synkroniserer roden til roden.
          local-dir: ./
          server-dir: ./

          # Filer/mapper der ikke skal med op på serveren.
          # Bemærk: én glob pr. linje (action'en læser dette som en flerlinje-streng).
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .context/**
            **/.DS_Store
            README.md
            public_html/index.html-old
